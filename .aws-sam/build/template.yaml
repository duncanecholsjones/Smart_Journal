AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda function with DynamoDB table using connectors and explicit IAM
  permission.
Resources:
  MyTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
  MyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: app.lambda_handler
      CodeUri: MyFunction
      Environment:
        Variables:
          TABLE_NAME:
            Ref: MyTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MyTable
    Metadata:
      SamResourceId: MyFunction
  MyConnector:
    Type: AWS::Serverless::Connector
    Properties:
      Source:
        Id: MyFunction
      Destination:
        Id: MyTable
      Permissions:
      - Read
      - Write
